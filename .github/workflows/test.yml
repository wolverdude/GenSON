name: Tests

on:
  push:
  pull_request:
    # covers PRs from forks; same-repo branches already run via push
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install -U 'jsonschema>=4.0.0' coverage
      - name: Run tests with coverage
        run: coverage run --source=genson -m unittest
      - name: Enforce coverage threshold
        run: coverage report --omit='*/__main__.py' --fail-under=90

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install flake8
        run: pip install -U flake8
      - name: Lint
        run: flake8
