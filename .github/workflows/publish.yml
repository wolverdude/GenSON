name: Publish

# Release flow (see RELEASING.md):
#   - rc tags (e.g. v1.3.1rc1) publish to TestPyPI for end-to-end validation
#   - final tags (e.g. v1.3.1) publish to PyPI
# Both use PyPI trusted publishing (OIDC) — no tokens stored in the repo.

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag matches package version
        # The published version comes from genson.__version__, NOT the
        # tag. Fail fast on mismatch so an rc tag can't silently publish
        # a final-looking version (see RELEASING.md).
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python -c 'import genson; print(genson.__version__)')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME != genson.__version__ ($PKG_VERSION)." \
                 "Bump genson/__init__.py and re-tag (see RELEASING.md)."
            exit 1
          fi
      - name: Run tests
        run: |
          pip install -U 'jsonschema>=4.0.0'
          python -m unittest
      - name: Build sdist and wheel
        run: |
          pip install -U build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: contains(github.ref_name, 'rc')
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install from TestPyPI and smoke test
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # the index can lag behind the upload; retry for a few minutes
          for i in $(seq 1 10); do
            pip install --index-url https://test.pypi.org/simple/ \
              "genson==$VERSION" && break
            echo "genson==$VERSION not yet on TestPyPI; retrying in 30s"
            sleep 30
          done
          python -c "import genson; v=genson.__version__; assert v == '$VERSION', v"
          python -m genson --version
          echo '{"hi": 5}' | genson

  publish-pypi:
    needs: build
    if: "!contains(github.ref_name, 'rc')"
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  verify-pypi:
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install from PyPI and smoke test
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 10); do
            pip install "genson==$VERSION" && break
            echo "genson==$VERSION not yet on PyPI; retrying in 30s"
            sleep 30
          done
          python -c "import genson; v=genson.__version__; assert v == '$VERSION', v"
          python -m genson --version
          echo '{"hi": 5}' | genson
