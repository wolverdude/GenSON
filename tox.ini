[tox]
envlist = py3{10,11,12,13,14}
skip_missing_interpreters = true

[testenv]
deps =
  jsonschema>=4.0.0
  coverage
  # docs-rendering checks only run on the latest Python; the test
  # skips itself wherever readme_renderer is absent
  py314: readme_renderer
commands =
  coverage run --source=genson -m unittest
  coverage report --omit='*/__main__.py' --fail-under=90
